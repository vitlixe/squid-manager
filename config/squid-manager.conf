# Squid Manager: Basic authentication and a domain whitelist.
# Installed into /etc/squid/conf.d/, which the distribution squid.conf includes
# before its final "http_access deny all".

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Squid proxy
# Squid caches checked passwords for this long, so deleted users and reset
# passwords stop working within a minute after Reload Squid.
auth_param basic credentialsttl 1 minute

acl squid_manager_users proxy_auth REQUIRED
acl squid_manager_whitelist dstdomain "/etc/squid-manager/whitelist"
acl squid_manager_ports port 80 443

http_access deny !squid_manager_ports
http_access allow squid_manager_users squid_manager_whitelist
http_access deny all
